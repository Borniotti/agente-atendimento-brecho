[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-brecho"
version = "0.1.0"
description = "Atendente virtual para brechós: agente com Claude e ferramentas de estoque, reserva e pedidos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agente-brecho = "agente_brecho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
